<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Báo D3 - Tin tức mỗi ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#FF7D00',
                    }
                }
            }
        }
    </script>
    <style>
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.12); }
        .article-full { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .article-full.expanded { max-height: 9999px; }
        .preview-img { position: relative; }
        .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 28px; height: 28px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="#" class="flex items-center gap-2">
                    <span class="text-2xl">📰</span>
                    <h1 class="text-xl font-bold text-primary">Nhật Báo D3</h1>
                </a>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                    </button>
                    <button id="addPostBtn" class="bg-secondary text-white px-4 py-2 rounded-lg text-sm font-medium">
                        <i class="fa-solid fa-plus mr-1"></i> Đăng bài
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="bg-yellow-50 dark:bg-yellow-900/20 border-l-4 border-yellow-400 p-4 mb-8 rounded-r-lg">
            <p class="text-sm text-yellow-800 dark:text-yellow-200 font-medium">
                ⚠️ Các bài đăng trên trang này là <strong>bản tin giả định</strong>, chỉ dùng cho mục đích minh họa
            </p>
        </div>

        <section>
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-newspaper text-primary"></i> Bài viết đã đăng
            </h2>
            <div id="postsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="font-bold text-lg mb-2">📰 Nhật Báo D3</p>
            <p class="text-gray-400 text-sm">© 2026 Nhật Báo D3 — Bài viết được lưu tự động</p>
        </div>
    </footer>

    <!-- Form Đăng Bài -->
    <div id="postModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white dark:bg-gray-800 p-5 border-b dark:border-gray-700 flex justify-between items-center">
                <h3 class="text-xl font-bold">✍️ Đăng bài viết mới</h3>
                <button id="closeModal" class="text-gray-500 hover:text-black dark:hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Tiêu đề bài viết *</label>
                    <input type="text" id="postTitle"
                        class="w-full p-3 border dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700"
                        placeholder="Nhập tiêu đề...">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Ảnh minh họa</label>
                    <div class="space-y-3">
                        <div>
                            <input type="file" id="file1" accept="image/*" class="w-full">
                            <div id="prev1" class="mt-2 hidden preview-img">
                                <img class="w-full h-32 object-cover rounded-lg">
                                <button class="del-btn" data-n="1"><i class="fa-solid fa-times"></i></button>
                            </div>
                        </div>
                        <div>
                            <input type="file" id="file2" accept="image/*" class="w-full">
                            <div id="prev2" class="mt-2 hidden preview-img">
                                <img class="w-full h-32 object-cover rounded-lg">
                                <button class="del-btn" data-n="2"><i class="fa-solid fa-times"></i></button>
                            </div>
                        </div>
                        <div>
                            <input type="file" id="file3" accept="image/*" class="w-full">
                            <div id="prev3" class="mt-2 hidden preview-img">
                                <img class="w-full h-32 object-cover rounded-lg">
                                <button class="del-btn" data-n="3"><i class="fa-solid fa-times"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Tác giả</label>
                    <input type="text" id="postAuthor" value="Quản trị"
                        class="w-full p-3 border dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Nội dung bài viết *</label>
                    <textarea id="postContent" rows="6"
                        class="w-full p-3 border dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700"
                        placeholder="Viết nội dung bài viết..."></textarea>
                </div>
                <div class="flex gap-3 pt-3">
                    <button id="cancelBtn" class="flex-1 py-3 border dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                        Hủy
                    </button>
                    <button id="submitBtn" class="flex-1 bg-secondary text-white py-3 rounded-lg font-medium">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Đăng bài
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-5 py-3 rounded-lg shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        Đăng bài thành công! ✅
    </div>

    <script>
        // Chế độ tối
        if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');
        document.getElementById('themeToggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark')?'dark':'light');
        };

        // Lưu bài viết
        let posts = JSON.parse(localStorage.getItem('nhatbaod3_posts')) || [];
        function savePosts() { localStorage.setItem('nhatbaod3_posts', JSON.stringify(posts)); }

        // Dữ liệu ảnh
        let images = ['', '', ''];

        // === CHỌN ẢNH ===
        function setupInput(num) {
            const input = document.getElementById('file'+num);
            const preview = document.getElementById('prev'+num);
            const img = preview.querySelector('img');

            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    images[num-1] = ev.target.result;
                    img.src = ev.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            });
        }
        setupInput(1);
        setupInput(2);
        setupInput(3);

        // Xóa ảnh
        document.addEventListener('click', function(e) {
            if(e.target.closest('.del-btn')) {
                const n = parseInt(e.target.closest('.del-btn').dataset.n);
                images[n-1] = '';
                document.getElementById('file'+n).value = '';
                document.getElementById('prev'+n).classList.add('hidden');
            }
        });

        // Mở/đóng form
        const modal = document.getElementById('postModal');
        document.getElementById('addPostBtn').onclick = () => {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };
        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postAuthor').value = 'Quản trị';
            images = ['', '', ''];
            document.getElementById('file1').value = '';
            document.getElementById('file2').value = '';
            document.getElementById('file3').value = '';
            document.getElementById('prev1').classList.add('hidden');
            document.getElementById('prev2').classList.add('hidden');
            document.getElementById('prev3').classList.add('hidden');
        }
        document.getElementById('closeModal').onclick = closeModal;
        document.getElementById('cancelBtn').onclick = closeModal;
        modal.onclick = e => e.target === modal && closeModal;

        // === ĐĂNG BÀI ===
        document.getElementById('submitBtn').onclick = function() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const author = document.getElementById('postAuthor').value.trim() || 'Ẩn danh';

            if(!title) { alert('Vui lòng nhập tiêu đề!'); return; }
            if(!content) { alert('Vui lòng nhập nội dung!'); return; }

            // Lọc ảnh đã chọn
            const selectedImgs = images.filter(i => i);

            // Tạo bài mới
            const newPost = {
                id: Date.now(),
                title: title,
                author: author,
                date: new Date().toLocaleDateString('vi-VN'),
                images: selectedImgs,
                content: content
            };

            posts.unshift(newPost);
            savePosts();
            renderPosts();
            closeModal();

            // Thông báo
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        };

        // === HIỂN THỊ BÀI — KHUNG VUÔNG NHỎ ===
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            
            if(posts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-500 dark:text-gray-400">
                        <i class="fa-solid fa-pen-to-square text-4xl mb-4 opacity-30"></i>
                        <p class="text-lg">Chưa có bài viết nào</p>
                        <p class="text-sm mt-1">Nhấn nút <strong>"Đăng bài"</strong> để viết bài đầu tiên!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => `
                <article class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden card-hover" data-id="${post.id}">
                    <!-- Ảnh bìa khung nhỏ -->
                    <div class="h-48 overflow-hidden bg-gray-100 dark:bg-gray-700">
                        ${post.images.length > 0 
                            ? `<img src="${post.images[0]}" class="w-full h-full object-cover">`
                            : `<div class="w-full h-full flex items-center justify-center text-4xl text-gray-300">📰</div>`
                        }
                    </div>
                    
                    <div class="p-4">
                        <span class="bg-yellow-100 dark:bg-yellow-900/50 text-yellow-700 dark:text-yellow-300 px-2 py-1 rounded-full text-xs">Bản tin giả định</span>
                        <h3 class="font-bold mt-2 mb-1 line-clamp-2">${post.title}</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400">${post.author} • ${post.date}</p>
                    </div>
                    
                    <div class="px-4 pb-4">
                        <button class="w-full py-2 text-sm text-primary border dark:border-gray-700 rounded-lg xem-btn" data-id="${post.id}">
                            Xem chi tiết <i class="fa-solid fa-chevron-down ml-1"></i>
                        </button>
                    </div>
                    
                    <!-- Nội dung đầy đủ ẩn -->
                    <div class="article-full border-t dark:border-gray-700 px-4 pb-4" id="full-${post.id}">
                        ${post.images.length > 1 ? `
                            <div class="grid grid-cols-2 gap-2 mt-3 mb-4">
                                ${post.images.slice(1).map(img => `<img src="${img}" class="w-full h-32 object-cover rounded-lg">`).join('')}
                            </div>
                        ` : ''}
                        <div class="whitespace-pre-line leading-relaxed text-gray-700 dark:text-gray-300 mt-2">
                            ${post.content}
                        </div>
                        <button class="w-full mt-4 py-2 text-sm border dark:border-gray-700 rounded-lg thu-btn" data-id="${post.id}">
                            <i class="fa-solid fa-chevron-up mr-1"></i> Thu gọn
                        </button>
                    </div>
                </article>
            `).join('');

            // Mở/thu gọn
            document.querySelectorAll('.xem-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    document.getElementById('full-'+id).classList.add('expanded');
                    this.style.display = 'none';
                };
            });
            document.querySelectorAll('.thu-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    document.getElementById('full-'+id).classList.remove('expanded');
                    document.querySelector(`.xem-btn[data-id="${id}"]`).style.display = 'block';
                };
            });
        }

        // Khởi tạo
        renderPosts();
    </script>
</body>
</html>
