<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật Báo D3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#165DFF', secondary: '#FF7D00' } } }
        }
    </script>
    <style>
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-3px); }
        .article-full { max-height: 0; overflow: hidden; transition: max-height 0.5s; }
        .article-full.open { max-height: 9999px; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-gray-800 shadow-md py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">📰 Nhật Báo D3</h1>
            <div class="flex gap-3">
                <button id="darkBtn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
                <button id="addBtn" class="bg-secondary text-white px-4 py-2 rounded-lg text-sm">
                    <i class="fa-solid fa-plus"></i> Đăng bài
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="bg-yellow-50 dark:bg-yellow-900/20 border-l-4 border-yellow-400 p-3 mb-6 rounded-r-lg text-sm">
            ⚠️ <strong>Bản tin giả định</strong> — dùng cho minh họa
        </div>

        <div id="danhSachBai"></div>
    </main>

    <footer class="bg-gray-900 text-white py-6 text-center text-sm mt-10">
        <p>© 2026 Nhật Báo D3</p>
    </footer>

    <!-- Form Đăng Bài -->
    <div id="formBai" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">✍️ Đăng bài mới</h3>
                <button id="dongForm" class="text-gray-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Tiêu đề *</label>
                    <input type="text" id="tieuDe" class="w-full p-3 border dark:border-gray-600 rounded-lg dark:bg-gray-700" placeholder="Nhập tiêu đề">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Ảnh 1</label>
                    <input type="file" id="anh1" accept="image/*" class="w-full">
                    <div id="xemTruoc1" class="mt-2 hidden"><img class="max-h-40 rounded-lg"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Ảnh 2</label>
                    <input type="file" id="anh2" accept="image/*" class="w-full">
                    <div id="xemTruoc2" class="mt-2 hidden"><img class="max-h-40 rounded-lg"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Ảnh 3</label>
                    <input type="file" id="anh3" accept="image/*" class="w-full">
                    <div id="xemTruoc3" class="mt-2 hidden"><img class="max-h-40 rounded-lg"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Tác giả</label>
                    <input type="text" id="tacGia" value="Quản trị" class="w-full p-3 border dark:border-gray-600 rounded-lg dark:bg-gray-700">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Nội dung *</label>
                    <textarea id="noiDung" rows="6" class="w-full p-3 border dark:border-gray-600 rounded-lg dark:bg-gray-700" placeholder="Viết nội dung..."></textarea>
                </div>

                <button id="nutDang" class="w-full bg-secondary text-white py-3 rounded-lg font-medium">
                    <i class="fa-solid fa-paper-plane"></i> Đăng bài
                </button>
            </div>
        </div>
    </div>

    <script>
        // Chế độ tối
        if(localStorage.getItem('dark')==='1' || (!localStorage.getItem('dark') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        document.getElementById('darkBtn').onclick = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark', document.documentElement.classList.contains('dark') ? '1' : '0');
        };

        // Lưu bài viết
        let dsBai = JSON.parse(localStorage.getItem('nhatbaod3')) || [];
        function luu() { localStorage.setItem('nhatbaod3', JSON.stringify(dsBai)); }

        // Xem trước ảnh ngay sau khi chọn
        ['anh1','anh2','anh3'].forEach((id, stt) => {
            document.getElementById(id).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(!file) return;
                const doc = new FileReader();
                doc.onload = function(kq) {
                    const anh = kq.target.result;
                    window['anhDuLieu'+(stt+1)] = anh;
                    const khung = document.getElementById('xemTruoc'+(stt+1));
                    khung.querySelector('img').src = anh;
                    khung.classList.remove('hidden');
                };
                doc.readAsDataURL(file);
            });
        });

        // Mở/đóng form
        const form = document.getElementById('formBai');
        document.getElementById('addBtn').onclick = () => {
            form.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };
        function dong() {
            form.classList.add('hidden');
            document.body.style.overflow = '';
            document.getElementById('tieuDe').value = '';
            document.getElementById('noiDung').value = '';
            document.getElementById('anh1').value = '';
            document.getElementById('anh2').value = '';
            document.getElementById('anh3').value = '';
            ['xemTruoc1','xemTruoc2','xemTruoc3'].forEach(id=>{
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).querySelector('img').src = '';
            });
            window.anhDuLieu1 = window.anhDuLieu2 = window.anhDuLieu3 = '';
        }
        document.getElementById('dongForm').onclick = dong;
        form.onclick = e => e.target === form && dong;

        // Đăng bài
        document.getElementById('nutDang').onclick = function() {
            const tieuDe = document.getElementById('tieuDe').value.trim();
            const noiDung = document.getElementById('noiDung').value.trim();
            if(!tieuDe) { alert('Nhập tiêu đề!'); return; }
            if(!noiDung) { alert('Nhập nội dung!'); return; }

            const anhList = [];
            if(window.anhDuLieu1) anhList.push(window.anhDuLieu1);
            if(window.anhDuLieu2) anhList.push(window.anhDuLieu2);
            if(window.anhDuLieu3) anhList.push(window.anhDuLieu3);

            dsBai.unshift({
                id: Date.now(),
                tieuDe,
                tacGia: document.getElementById('tacGia').value.trim() || 'Ẩn danh',
                ngay: new Date().toLocaleDateString('vi-VN'),
                anh: anhList,
                noiDung
            });
            luu();
            xoaDanhSach();
            dong();
            alert('✅ Đăng bài thành công!');
        };

        // Hiển thị danh sách bài
        function xoaDanhSach() {
            const khung = document.getElementById('danhSachBai');
            if(dsBai.length === 0) {
                khung.innerHTML = `<p class="text-center text-gray-500 py-12">Chưa có bài viết nào.<br>Nhấn "Đăng bài" để viết bài đầu tiên!</p>`;
                return;
            }
            khung.innerHTML = dsBai.map(bai => `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md mb-4 overflow-hidden card-hover">
                    <div class="p-5">
                        <span class="bg-yellow-100 dark:bg-yellow-900/50 text-yellow-700 dark:text-yellow-300 px-2 py-1 rounded-full text-xs">Bản tin giả định</span>
                        <h3 class="text-lg font-bold mt-2 mb-1 cursor-pointer">${bai.tieuDe}</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">${bai.tacGia} • ${bai.ngay}</p>
                        
                        <div class="article-full">
                            ${bai.anh.length > 0 ? `
                                <div class="grid ${bai.anh.length === 1 ? 'grid-cols-1' : 'grid-cols-2 md:grid-cols-3'} gap-2 mb-3">
                                    ${bai.anh.map(a=>`<img src="${a}" class="w-full h-32 object-cover rounded-lg">`).join('')}
                                </div>
                            ` : ''}
                            <p class="whitespace-pre-line leading-relaxed">${bai.noiDung}</p>
                        </div>
                        
                        <button class="mt-3 text-primary hover:text-secondary xemBtn" data-id="${bai.id}">
                            <span>Xem chi tiết</span> <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            // Nút mở/thu gọn
            document.querySelectorAll('.xemBtn').forEach(btn => {
                btn.onclick = function() {
                    const bai = this.closest('.mb-4');
                    const noiDung = bai.querySelector('.article-full');
                    if(noiDung.classList.contains('open')) {
                        noiDung.classList.remove('open');
                        this.innerHTML = '<span>Xem chi tiết</span> <i class="fa-solid fa-chevron-down text-xs"></i>';
                    } else {
                        noiDung.classList.add('open');
                        this.innerHTML = '<span>Thu gọn</span> <i class="fa-solid fa-chevron-up text-xs"></i>';
                    }
                };
            });
        }

        xoaDanhSach();
    </script>
</body>
</html>
